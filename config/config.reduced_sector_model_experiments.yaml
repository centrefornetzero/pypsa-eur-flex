# Trimmed sector-coupled override config with orchestrator-driven experiments
#
# It relies on config.default.yaml for unchanged defaults. 
# Active sectors are power, heat, hydrogen (for electricity), co2 (as an output) and transport.
# Experiments are auto-generated from experiment_orchestrator config.

private:
  keys:
    entsoe_api: 53f9250b-91d3-4d15-af4f-c0b8b1f155e2

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#run
run:
  prefix: "multi_experiment_results"
  name: all
  scenarios:
    enable: true
    file: config/scenarios.experiments.yaml
  disable_progressbar: false
  shared_resources:
    # with this setting we avoid running all of the preprocessing for each individual scenario
    # We are changing bev_dsm, v2g, hydrogen, dac, which all operate at the model-construction layer, 
    # not the data-preparation layer -> so data prep can be shared. 
    policy: "base" 
    exclude: []
  shared_cutouts: true
  use_shadow_directory: false

# Experiment orchestration for automatic scenario generation via config/create_scenarios.py.
# Scenario names are combined as "{policy_scenario}__{flex_option}" and become run suffixes in results/.
experiment_orchestrator:
  name_separator: "__"
  planning_horizons:
  - 2025
  - 2030
  - 2040
  - 2050
  flex_options:
    flex00_no_bev_flex:
      sector:
        bev_dsm: false
        bev_dsm_availability: 0.0
        v2g: false
        v2g_availability: 0.0
    flex30_bev_dsm:
      sector:
        bev_dsm: true
        bev_dsm_availability: 0.3
        v2g: false
        v2g_availability: 0.0
    flex100_bev_dsm:
      sector:
        bev_dsm: true
        bev_dsm_availability: 1.0
        v2g: false
        v2g_availability: 0.0
    flex100_bev_dsm_v2g:
      sector:
        bev_dsm: true
        bev_dsm_availability: 1.0
        v2g: true
        v2g_availability: 1.0
  policy_scenarios:
    baseline: {}
    tx_v1p5:
      electricity:
        transmission_limit: v1.5
    no_h2:
      sector:
        hydrogen_fuel_cell: false
        hydrogen_turbine: false
    no_ccus:
      sector:
        dac: false
    no_h2_no_ccus:
      sector:
        hydrogen_fuel_cell: false
        hydrogen_turbine: false
        dac: false

##################### NOTE #############################################
# Everything below here is a default value. If duplicate params exist here
# and in the `experiment_orchestrator` block above, then the values in 
# `experiment_orchestrator` will override the defaults below.

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#foresight
foresight: myopic # Make Myopic when running multi-sector, overnight when running elec network only. 

scenario:
  clusters:
  - 39
  sector_opts:
  - ''
  planning_horizons:
    - 2025
    - 2030
    - 2040
    - 2050
  current_year: 2026

snapshots:
  start: "2019-01-01"
  end: "2020-01-01"

